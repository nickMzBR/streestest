<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vercel Target - Monitor de Estresse</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <header class="border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold text-sky-400">⚡ Servidor Alvo no Vercel</h1>
      <p class="text-slate-400 text-sm">Painel de Monitoramento de Endpoints Serverless</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <span class="text-xs text-slate-400 uppercase">Requisições Lidas</span>
        <span id="reqCount" class="text-3xl font-bold font-mono text-sky-400 block mt-1">0</span>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <span class="text-xs text-slate-400 uppercase">Tempo de Resposta (Média)</span>
        <span id="avgLatency" class="text-3xl font-bold font-mono text-amber-400 block mt-1">0 ms</span>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
        <span class="text-xs text-slate-400 uppercase">Região da Serverless</span>
        <span id="region" class="text-3xl font-bold font-mono text-emerald-400 block mt-1">--</span>
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
      <h2 class="text-lg font-semibold text-slate-200">Como Testar este Servidor</h2>
      <p class="text-sm text-slate-400">
        Apunte sua ferramenta de teste para a URL da API Serverless:
      </p>
      <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 font-mono text-xs text-sky-300 break-all" id="targetEndpoint">
        Carregando URL...
      </div>
    </div>

  </div>

  <script>
    const endpoint = window.location.origin + '/api/stress';
    document.getElementById('targetEndpoint').textContent = endpoint;

    let totalReads = 0;
    let totalLatency = 0;

    // Loop de amostragem para medir como o endpoint está respondendo durante o teste
    setInterval(async () => {
      const start = performance.now();
      try {
        const res = await fetch('/api/stress?ping=' + Date.now());
        const data = await res.json();
        const latency = Math.round(performance.now() - start);

        totalReads++;
        totalLatency += latency;

        document.getElementById('reqCount').textContent = totalReads;
        document.getElementById('avgLatency').textContent = Math.round(totalLatency / totalReads) + ' ms';
        document.getElementById('region').textContent = data.region || 'Vercel Edge';
      } catch (e) {
        // Se a Serverless falhar ou der timeout
        document.getElementById('avgLatency').textContent = 'ERRO / TIMEOUT';
      }
    }, 1000);
  </script>
</body>
</html>
